# Production compose file.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (development):
#   - No source bind-mount (runs the image as built, not live-reloaded)
#   - Uses the Dockerfile's default command (npm start -> NODE_ENV=production)
#   - Swagger UI disabled
#   - Real secrets must be supplied via a production .env.production file
#     or your platform's secret manager — never commit real secrets.

services:
  api:
    container_name: mira_api_prod
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/mira
      - REDIS_URL=redis://redis:6379
      - ENABLE_SWAGGER=false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    container_name: mira_mongo_prod
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: mira_redis_prod
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
